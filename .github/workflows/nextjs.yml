name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Restore npm cache
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('main/package-lock.json') }}

      # 4. Install dependencies (save logs on failure)
      - name: Install dependencies
        run: |
          npm ci || (mkdir -p ./main/logs && cp ~/.npm/_logs/*.log ./main/logs/ && exit 1)
        working-directory: ./main

      # 5. Upload npm logs if installation failed
      - name: Upload npm logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ./main/logs

      # 6. Build Next.js and export static HTML
      - name: Build Next.js
        run: npm run build
        working-directory: ./main

      # 7. Copy exported site into docs
      - name: Copy static export to docs
        run: |
          rm -rf ./docs
          mkdir -p ./docs
          cp -a ./main/out/. ./docs/
          touch ./docs/.nojekyll

      # 8. Commit docs folder back to main branch
      - name: Commit docs folder back to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || (git commit -m 'Deploy docs [skip ci]' && git push origin main)
